name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit and component tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  backend:
    name: Database and integration tests
    runs-on: ubuntu-latest
    # Fail fast instead of GitHub's 6-hour default if anything hangs.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bootstrap
      - run: pnpm test:db
      - run: pnpm test:coverage

  # One machine per screen size, side by side, so the slowest job sets the wait rather than the sum.
  # Each sets up its own database, which costs more CI minutes than one long job.
  e2e:
    name: End-to-end tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [phone, tablet, desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bootstrap
      - run: pnpm build
      - run: pnpm exec playwright test --project=${{ matrix.project }}
      # The budgets use Lighthouse's phone profile, so they ride on the phone job and its build.
      - name: Performance budgets
        if: ${{ matrix.project == 'phone' }}
        run: pnpm test:budgets
      - uses: actions/upload-artifact@v4
        # Also after a timeout or cancellation, so the report explains what happened.
        if: ${{ !success() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7
