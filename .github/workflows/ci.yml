name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit and component tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  backend:
    name: Database, integration and end-to-end tests
    runs-on: ubuntu-latest
    # Fail fast instead of GitHub's 6-hour default if anything hangs.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bootstrap
      - run: pnpm test:db
      - run: pnpm test:coverage
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        # Also after a timeout or cancellation, so the report explains what happened.
        if: ${{ !success() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
